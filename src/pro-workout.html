<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack Pro</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Kanit','sans-serif']},animation:{'fade-up':'fadeUp .45s ease-out both','pop':'pop .25s ease-out both','pulse-soft':'pulseSoft 1.8s ease-in-out infinite'}},keyframes:{fadeUp:{'0%':{opacity:0,transform:'translateY(14px)'},'100%':{opacity:1,transform:'translateY(0)'}},pop:{'0%':{transform:'scale(.9)',opacity:0},'100%':{transform:'scale(1)',opacity:1}},pulseSoft:{'0%,100%':{transform:'scale(1)'},'50%':{transform:'scale(1.03)'}}}}}</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>body{font-family:Kanit,sans-serif}.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(18px)}.darkglass{background:rgba(15,23,42,.86);backdrop-filter:blur(18px)}.gridbg{background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.035) 1px,transparent 1px);background-size:28px 28px}</style></head><body class="bg-slate-50 text-slate-900"><div id="app"></div><script>
const exercises=[['goblet-squat','Goblet Squat','Squat','10–12','8'],['rdl','Dumbbell Romanian Deadlift','RDL','10–12','8'],['floor-press','Dumbbell Floor Press','Floor Press','10–12','6'],['row','One-arm Dumbbell Row','Row','10 / side','8'],['shoulder-press','Dumbbell Shoulder Press','Shoulder Press','8–10','6'],['plank','Plank','Core','30–45 sec','0']];let state={page:'dashboard',ex:0,set:0,running:false,resting:false,rest:90,started:null,setStarted:null,sets:[],weights:Object.fromEntries(exercises.map(x=>[x[0],+x[4]])),sessions:[]};try{Object.assign(state,JSON.parse(localStorage.getItem('fittrack-pro')||'{}'))}catch{};const save=()=>localStorage.setItem('fittrack-pro',JSON.stringify(state));
function icon(n){return `<i data-lucide="${n}" class="w-5 h-5"></i>`}function nav(p){state.page=p;render()}function start(){state.page='workout';state.running=true;state.started=state.started||Date.now();state.setStarted=Date.now();render()}function complete(){if(!state.running)return;let e=exercises[state.ex];let elapsed=Math.max(1,Math.round((Date.now()-state.setStarted)/1000));state.sets.push({exerciseId:e[0],exercise:e[1],set:state.set+1,reps:e[3],weightKg:state.weights[e[0]],startedAt:new Date(state.setStarted).toISOString(),completedAt:new Date().toISOString(),durationSeconds:elapsed,restSeconds:state.set+1<3?state.rest:0});state.set++;state.resting=state.set<3;state.rest=90;save();render();if(state.resting)tick()}
function tick(){if(!state.resting)return;if(state.rest>0){state.rest--;render();setTimeout(tick,1000)}else{state.resting=false;state.setStarted=Date.now();render()}}function skip(){state.resting=false;state.setStarted=Date.now();render()}function finish(){if(!state.sets.length)return;state.sessions.push({date:new Date().toISOString(),durationMinutes:Math.max(1,Math.round((Date.now()-state.started)/60000)),sets:state.sets});state.running=false;state.resting=false;state.ex=0;state.set=0;state.sets=[];state.started=null;save();nav('history')}
function shell(content){return `<div class="min-h-screen gridbg"><div class="fixed inset-x-0 top-0 z-30 h-16 border-b border-slate-200/70 glass"><div class="max-w-7xl mx-auto h-full px-4 lg:px-8 flex items-center justify-between"><button onclick="nav('dashboard')" class="flex items-center gap-3 font-semibold text-lg"><span class="w-9 h-9 rounded-xl bg-slate-950 text-white grid place-items-center">F</span>FitTrack<span class="hidden sm:inline text-xs text-slate-400 font-normal">PRO</span></button><div class="flex items-center gap-2"><span class="hidden sm:block text-xs text-slate-400">${new Intl.DateTimeFormat('th-TH',{weekday:'long',day:'numeric',month:'short'}).format(new Date())}</span><button class="w-10 h-10 rounded-xl hover:bg-slate-100 transition">${icon('bell')}</button></div></div></div><div class="max-w-7xl mx-auto px-4 lg:px-8 pt-24 pb-24 lg:pb-10 lg:grid lg:grid-cols-[220px_1fr] lg:gap-8"><aside class="hidden lg:block sticky top-24 h-fit"><nav class="space-y-1">${[['dashboard','layout-dashboard','Dashboard'],['workout','dumbbell','Workout'],['history','history','History'],['progress','chart-no-axes-combined','Progress'],['settings','settings','Settings']].map(x=>`<button onclick="nav('${x[0]}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition ${state.page===x[0]?'bg-slate-950 text-white shadow-lg shadow-slate-950/10':'text-slate-500 hover:bg-white hover:text-slate-900'}">${icon(x[1])}${x[2]}</button>`).join('')}</nav><div class="mt-8 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm"><p class="text-xs text-slate-400">WEEKLY GOAL</p><p class="font-semibold mt-1">${Math.min(state.sessions.length,4)} / 4 workouts</p><div class="h-2 bg-slate-100 rounded-full mt-3 overflow-hidden"><div class="h-full bg-slate-950 rounded-full transition-all" style="width:${Math.min(state.sessions.length/4*100,100)}%"></div></div></div></aside><main class="min-w-0">${content}</main></div><nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 border-t border-slate-200 glass"><div class="grid grid-cols-5 max-w-lg mx-auto">${[['dashboard','layout-dashboard'],['workout','dumbbell'],['history','history'],['progress','chart-no-axes-combined'],['settings','settings']].map(x=>`<button onclick="nav('${x[0]}')" class="py-3 flex justify-center ${state.page===x[0]?'text-slate-950':'text-slate-400'}">${icon(x[1])}</button>`).join('')}</div></nav></div>`}
function dashboard(){let done=state.sessions.at(-1)?.sets?.length||0;return shell(`<div class="animate-fade-up"><div class="flex items-end justify-between mb-7"><div><p class="text-sm font-medium text-slate-400">GOOD ${new Date().getHours()<12?'MORNING':'EVENING'}</p><h1 class="text-3xl sm:text-4xl font-semibold tracking-tight">Ready for your workout?</h1></div><button onclick="start()" class="hidden sm:flex items-center gap-2 bg-slate-950 text-white px-5 py-3 rounded-xl hover:scale-[1.02] transition shadow-lg">${icon('play')} Start workout</button></div><div class="grid sm:grid-cols-3 gap-4 mb-6"><div class="sm:col-span-2 rounded-3xl bg-slate-950 text-white p-6 sm:p-8 shadow-xl shadow-slate-950/10 relative overflow-hidden"><div class="absolute -right-20 -top-20 w-64 h-64 rounded-full bg-white/5"></div><span class="text-xs tracking-widest text-slate-400">TODAY · FULL BODY</span><h2 class="text-2xl sm:text-3xl font-semibold mt-3">Build strength.<br>Move better.</h2><p class="text-slate-400 mt-2 max-w-md">6 exercises · 18 sets · progressive training</p><button onclick="start()" class="mt-6 bg-white text-slate-950 px-5 py-3 rounded-xl font-medium hover:scale-[1.02] transition">Continue workout →</button></div><div class="rounded-3xl bg-white border border-slate-100 p-6 shadow-sm"><p class="text-sm text-slate-400">This week</p><div class="text-5xl font-semibold mt-5">${Math.min(state.sessions.length,4)}</div><p class="text-slate-400">workouts completed</p><div class="h-2 bg-slate-100 rounded-full mt-7"><div class="h-full bg-slate-950 rounded-full" style="width:${Math.min(state.sessions.length/4*100,100)}%"></div></div></div></div><div class="grid grid-cols-3 gap-3 mb-7">${[['activity','Workouts',state.sessions.length],['timer','Minutes',state.sessions.reduce((a,x)=>a+(x.durationMinutes||0),0)],['layers-3','Sets',state.sessions.reduce((a,x)=>a+(x.sets?.length||0),0)]].map(x=>`<div class="bg-white rounded-2xl border border-slate-100 p-4">${icon(x[0])}<p class="text-xs text-slate-400 mt-3">${x[1]}</p><b class="text-xl">${x[2]}</b></div>`).join('')}</div><div class="bg-white rounded-3xl border border-slate-100 p-5 sm:p-6"><div class="flex justify-between items-center mb-5"><div><h3 class="font-semibold text-lg">Today's exercises</h3><p class="text-sm text-slate-400">Your full body program</p></div><button onclick="nav('workout')" class="text-sm font-medium">View all →</button></div><div class="grid sm:grid-cols-2 gap-2">${exercises.map((e,i)=>`<button onclick="state.ex=${i};nav('workout')" class="group text-left p-4 rounded-2xl hover:bg-slate-50 transition flex items-center gap-4"><span class="w-11 h-11 rounded-xl bg-slate-100 grid place-items-center text-xs font-semibold">${String(i+1).padStart(2,'0')}</span><span class="flex-1"><b class="block">${e[1]}</b><small class="text-slate-400">${e[3]} reps · ${state.weights[e[0]]?state.weights[e[0]]+' kg':'Bodyweight'}</small></span>${icon('chevron-right')}</button>`).join('')}</div></div></div>`)}
function workout(){let e=exercises[state.ex],done=state.set,rest=state.rest;return shell(`<div class="animate-fade-up max-w-3xl mx-auto"><div class="flex justify-between items-center mb-5"><div><p class="text-xs tracking-widest text-slate-400">FULL BODY · ${state.ex+1} / ${exercises.length}</p><h1 class="text-2xl font-semibold">Workout</h1></div><button onclick="finish()" class="text-sm text-slate-500 hover:text-slate-950">Finish</button></div><div class="rounded-[2rem] bg-slate-950 text-white overflow-hidden shadow-2xl"><div class="h-64 sm:h-80 relative grid place-items-center bg-[radial-gradient(circle_at_center,#334155,transparent_55%)]"><div class="absolute top-4 left-4 right-4 flex justify-between text-xs text-slate-400"><span>${state.resting?'REST':'ACTIVE'}</span><span>${done}/3 sets</span></div><div class="w-36 h-36 rounded-full border border-white/10 grid place-items-center animate-pulse-soft"><div class="w-20 h-20 rounded-full bg-white/10 grid place-items-center">${icon('dumbbell')}</div></div><div class="absolute bottom-5 text-xs text-slate-500">LIVE DEMO · FORM FOCUS</div></div><div class="p-5 sm:p-7"><div class="flex items-end justify-between gap-4"><div><span class="inline-flex px-3 py-1 rounded-full bg-white/10 text-xs text-slate-300">STRENGTH</span><h2 class="text-3xl font-semibold mt-3">${e[1]}</h2><p class="text-slate-400">${e[3]} reps · ${state.weights[e[0]]?state.weights[e[0]]+' kg':'bodyweight'}</p></div><div class="text-right"><p class="text-xs text-slate-500">SET</p><b class="text-4xl">${Math.min(done+1,3)}<span class="text-lg text-slate-500">/3</span></b></div></div><div class="grid grid-cols-3 gap-2 mt-6">${[0,1,2].map(i=>`<div class="h-2 rounded-full ${i<done?'bg-white':'bg-white/10'} transition-all"></div>`).join('')}</div>${state.resting?`<div class="mt-7 rounded-2xl bg-white/10 p-5 text-center animate-pop"><p class="text-xs tracking-widest text-slate-400">REST</p><div class="text-5xl font-semibold tabular-nums my-2">${String(Math.floor(rest/60)).padStart(2,'0')}:${String(rest%60).padStart(2,'0')}</div><div class="flex gap-2 justify-center"><button onclick="state.rest+=15;render()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15">+15s</button><button onclick="skip()" class="px-4 py-2 rounded-xl bg-white text-slate-950">Skip rest</button></div></div>`:`<button onclick="${state.running?'complete()':'start()'}" class="w-full mt-7 bg-white text-slate-950 py-4 rounded-2xl font-semibold text-lg hover:scale-[1.01] transition shadow-lg">${state.running?'✓ Complete Set':'Start Set'}</button>`}<div class="mt-5 p-4 rounded-2xl bg-white/5 text-sm text-slate-400 flex gap-3">${icon('sparkles')}<span><b class="text-white">Form focus</b><br>${['Keep your core tight and control the movement.','Hinge at the hips and keep a neutral spine.','Move smoothly and avoid rushing the eccentric.','Keep your back stable and drive through the elbow.'][state.ex%4]}</span></div></div></div></div>`)}
function history(){return shell(`<div class="animate-fade-up"><p class="text-xs tracking-widest text-slate-400">HISTORY</p><h1 class="text-3xl font-semibold mt-1 mb-7">Your workouts</h1><div class="space-y-3">${state.sessions.length?state.sessions.slice().reverse().map(x=>`<div class="bg-white border border-slate-100 rounded-2xl p-5 flex justify-between items-center"><div><b>Full Body Workout</b><p class="text-sm text-slate-400 mt-1">${new Date(x.date).toLocaleString('th-TH')} · ${x.sets?.length||0} sets · ${x.durationMinutes||0} min</p></div><span class="w-10 h-10 rounded-full bg-slate-100 grid place-items-center">${icon('check')}</span></div>`).join(''):`<div class="bg-white rounded-3xl border border-slate-100 p-12 text-center"><div class="mx-auto w-14 h-14 rounded-2xl bg-slate-100 grid place-items-center">${icon('history')}</div><h2 class="font-semibold text-xl mt-5">No workouts yet</h2><p class="text-slate-400 mt-1">Complete your first workout to see it here.</p><button onclick="start()" class="mt-6 bg-slate-950 text-white px-5 py-3 rounded-xl">Start workout</button></div>`}</div></div>`)}
function progress(){let sets=state.sessions.flatMap(x=>x.sets||[]),volume=sets.reduce((a,x)=>a+(x.weightKg||0)*(parseInt(x.reps)||0),0);return shell(`<div class="animate-fade-up"><p class="text-xs tracking-widest text-slate-400">PROGRESS</p><h1 class="text-3xl font-semibold mt-1 mb-7">Training overview</h1><div class="grid sm:grid-cols-3 gap-4 mb-6">${[['trophy','Total sets',sets.length],['weight','Volume',Math.round(volume)+' kg'],['clock-3','Avg set time',sets.length?Math.round(sets.reduce((a,x)=>a+x.durationSeconds,0)/sets.length)+'s':'0s']].map(x=>`<div class="bg-white border border-slate-100 rounded-2xl p-5">${icon(x[0])}<p class="text-sm text-slate-400 mt-4">${x[1]}</p><b class="text-2xl">${x[2]}</b></div>`).join('')}</div><div class="bg-white border border-slate-100 rounded-3xl p-6"><h2 class="font-semibold text-lg">Exercise progress</h2><div class="mt-5 space-y-5">${exercises.map(e=>{let a=sets.filter(x=>x.exerciseId===e[0]);let w=a.at(-1)?.weightKg||state.weights[e[0]];return `<div><div class="flex justify-between text-sm mb-2"><span>${e[1]}</span><b>${w? w+' kg':'Bodyweight'}</b></div><div class="h-2 bg-slate-100 rounded-full"><div class="h-full bg-slate-950 rounded-full" style="width:${Math.min(a.length/3*100,100)}%"></div></div></div>`}).join('')}</div></div></div>`)}
function settings(){return shell(`<div class="animate-fade-up max-w-3xl"><p class="text-xs tracking-widest text-slate-400">SETTINGS</p><h1 class="text-3xl font-semibold mt-1 mb-7">Workout settings</h1><div class="bg-white border border-slate-100 rounded-3xl p-6"><h2 class="font-semibold text-lg">Default weights</h2><p class="text-sm text-slate-400 mb-5">กำหนดน้ำหนักเริ่มต้นของแต่ละท่า</p><div class="space-y-2">${exercises.map(e=>`<div class="flex items-center gap-4 p-4 rounded-2xl hover:bg-slate-50 transition"><div class="w-10 h-10 rounded-xl bg-slate-100 grid place-items-center text-xs font-semibold">${e[0].slice(0,2).toUpperCase()}</div><div class="flex-1"><b>${e[1]}</b><p class="text-xs text-slate-400">${e[3]} reps</p></div>${e[4]==='0'?'<span class="text-sm text-slate-400">Bodyweight</span>':`<div class="flex items-center gap-2"><button onclick="state.weights['${e[0]}']=Math.max(0,state.weights['${e[0]}']-.5);save();render()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200">−</button><b class="w-14 text-center">${state.weights[e[0]].toFixed(1)} kg</b><button onclick="state.weights['${e[0]}']+=.5;save();render()" class="w-9 h-9 rounded-xl bg-slate-950 text-white hover:scale-105 transition">+</button></div>`}</div>`).join('')}</div></div><div class="bg-white border border-slate-100 rounded-3xl p-6 mt-4"><h2 class="font-semibold">Rest timer</h2><p class="text-sm text-slate-400">เวลาพักหลังจบแต่ละเซ็ต</p><div class="mt-4 text-3xl font-semibold">90 <span class="text-base text-slate-400">seconds</span></div></div></div>`)}
function render(){let c={dashboard,workout,history,progress,settings}[state.page]();document.getElementById('app').innerHTML=c;lucide.createIcons()}render();
</script></body></html>
