<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitTrack Pro</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="appFrame" src="./warmup.html" title="FitTrack Pro"></iframe>
<script>
const IMAGES={
'Goblet Squat':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Artemis_Program_Physical_Exercise_(7654258).jpg',
'Dumbbell Romanian Deadlift':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Fitness_is_more_than_a_daily_obligation;_it%27s_a_legacy_(8966986).jpg',
'Dumbbell Floor Press':'https://commons.wikimedia.org/wiki/Special:Redirect/file/One-arm-floor-press-1.png',
'One-arm Dumbbell Row':'https://commons.wikimedia.org/wiki/Special:Redirect/file/DumbbellBentOverRow.JPG',
'Dumbbell Shoulder Press':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Dumbbell-shoulder-press-1.png',
'Plank':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Personal_training_plank_exercise_instruction.jpg'};
const credits={'Goblet Squat':'U.S. Marine Corps · Public Domain','Dumbbell Romanian Deadlift':'U.S. Air Force · Public Domain','Dumbbell Floor Press':'Everkinetic · CC BY-SA 3.0','One-arm Dumbbell Row':'Everkinetic · CC BY-SA 3.0','Dumbbell Shoulder Press':'Everkinetic · CC BY-SA 3.0','Plank':'PTPioneer · CC BY-SA 4.0'};
function showWorkout(){const f=document.getElementById('appFrame');f.src='./fittrack.html';f.onload=()=>setTimeout(()=>{try{if(typeof f.contentWindow.beginWorkout==='function')f.contentWindow.beginWorkout()}catch(e){}patch()},150)}
function startFitTrackWorkout(){showWorkout()}
function cancelWarmup(){showWorkout()}
function patch(){const f=document.getElementById('appFrame');let d;try{d=f.contentDocument}catch{return}if(!d||!d.body)return;const text=d.body.innerText||'';let exercise=Object.keys(IMAGES).find(n=>text.includes(n));if(exercise){const svg=d.querySelector('svg');if(svg&&!svg.dataset.exercisePhoto){const img=d.createElement('img');img.src=IMAGES[exercise];img.alt=exercise;img.dataset.exercisePhoto='1';img.style.cssText='width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:normal;filter:saturate(.95);';svg.replaceWith(img);const holder=img.parentElement;holder.style.background='#0f172a';const credit=d.createElement('div');credit.textContent=credits[exercise];credit.style.cssText='position:absolute;top:12px;left:12px;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#cbd5e1;font:11px system-ui;z-index:5;';holder.appendChild(credit)}}d.querySelectorAll('button').forEach(btn=>{const n=Object.keys(IMAGES).find(x=>btn.textContent.includes(x));if(!n||btn.dataset.photoCard)return;btn.dataset.photoCard='1';const img=d.createElement('img');img.src=IMAGES[n];img.alt='';img.style.cssText='width:52px;height:52px;object-fit:cover;border-radius:14px;flex:none;';btn.insertBefore(img,btn.firstChild)})}
const f=document.getElementById('appFrame');f.addEventListener('load',()=>{setTimeout(patch,100);try{const d=f.contentDocument;if(d)new MutationObserver(()=>patch()).observe(d.body,{childList:true,subtree:true})}catch(e){}});setInterval(patch,1000);
</script>
</body>
</html>
