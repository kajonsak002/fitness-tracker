<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FitTrack Pro — Workout</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Kanit','sans-serif']},keyframes:{in:{'0%':{opacity:0,transform:'translateY(18px) scale(.98)'},'100%':{opacity:1,transform:'none'}},pop:{'0%':{transform:'scale(.92)'},'70%':{transform:'scale(1.04)'},'100%':{transform:'scale(1)'}}},animation:{in:'.4s ease-out both in',pop:'.3s ease-out both pop'}}}}</script><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>html,body{font-family:Kanit,sans-serif}button{touch-action:manipulation}.safe{padding-bottom:env(safe-area-inset-bottom)}.no-scroll{overflow:hidden}.ring{background:conic-gradient(#fff var(--p),rgba(255,255,255,.12) 0)}.figure{filter:drop-shadow(0 24px 32px rgba(0,0,0,.25))}</style></head><body class="bg-slate-950 text-white"><div id="app"></div><script>
const EX=[{id:'goblet',name:'Goblet Squat',target:'10–12 reps',kg:8,tip:'อกเปิด หลังตรง ดันพื้นขึ้นด้วยส้นเท้า',pose:'squat'},{id:'rdl',name:'Dumbbell Romanian Deadlift',target:'10–12 reps',kg:8,tip:'ดันสะโพกไปด้านหลัง รักษาหลังให้เป็นกลาง',pose:'hinge'},{id:'press',name:'Dumbbell Floor Press',target:'10–12 reps',kg:6,tip:'ควบคุมข้อศอกและดันดัมเบลขึ้นอย่างนุ่มนวล',pose:'press'},{id:'row',name:'One-arm Dumbbell Row',target:'10 / side',kg:8,tip:'เกร็งแกนกลาง ดึงศอกไปด้านหลัง',pose:'row'},{id:'shoulder',name:'Dumbbell Shoulder Press',target:'8–10 reps',kg:6,tip:'กดขึ้นเหนือศีรษะโดยไม่แอ่นหลัง',pose:'shoulder'},{id:'plank',name:'Plank',target:'30–45 sec',kg:0,tip:'ลำตัวเป็นเส้นตรง เกร็งหน้าท้องตลอดเวลา',pose:'plank'}];
let S={screen:'home',ex:0,set:0,phase:'idle',rest:90,restStarted:0,setStarted:0,workoutStarted:0,sets:[],sessions:[],weights:{}};try{S={...S,...JSON.parse(localStorage.getItem('fittrack-v2')||'{}')}}catch{};EX.forEach(e=>{if(S.weights[e.id]===undefined)S.weights[e.id]=e.kg});const save=()=>localStorage.setItem('fittrack-v2',JSON.stringify(S));const I=n=>`<i data-lucide="${n}" class="w-5 h-5"></i>`;
function go(screen){S.screen=screen;render()}function begin(){S.screen='workout';S.phase='ready';S.workoutStarted=S.workoutStarted||Date.now();S.setStarted=0;render()}function startSet(){S.phase='active';S.setStarted=Date.now();if(!S.workoutStarted)S.workoutStarted=Date.now();render()}function completeSet(){if(S.phase!=='active')return;const now=Date.now(),e=EX[S.ex],dur=Math.max(1,Math.round((now-S.setStarted)/1000));S.sets.push({exerciseId:e.id,exercise:e.name,set:S.set+1,reps:e.target,weightKg:S.weights[e.id],startedAt:new Date(S.setStarted).toISOString(),completedAt:new Date(now).toISOString(),durationSeconds:dur,restSeconds:90});S.set++;if(S.set>=3){S.phase='complete';save();render();return}S.phase='rest';S.rest=90;S.restStarted=Date.now();save();render();tick()}function tick(){if(S.phase!=='rest')return;const elapsed=Math.floor((Date.now()-S.restStarted)/1000);S.rest=Math.max(0,90-elapsed);if(S.rest===0){S.phase='ready';S.setStarted=0;render();return}render();setTimeout(tick,500)}function endRest(){S.phase='ready';S.setStarted=0;S.rest=90;render()}function nextExercise(){if(S.ex<EX.length-1){S.ex++;S.set=0;S.phase='ready';S.setStarted=0;render()}else finish()}function finish(){if(!S.sets.length)return;S.sessions.push({date:new Date().toISOString(),durationMinutes:Math.max(1,Math.round((Date.now()-S.workoutStarted)/60000)),sets:S.sets});S={...S,screen:'history',ex:0,set:0,phase:'idle',rest:90,restStarted:0,setStarted:0,workoutStarted:0,sets:[],weights:S.weights};save();render()}
function figure(pose){let arm=pose==='row'?'M120 120 L75 150 L55 135':'M120 120 L170 150 L185 135';let leg=pose==='squat'?'M125 175 L95 225 L60 225 M125 175 L160 225 L195 225':'M125 175 L105 240 M125 175 L150 240';return `<svg viewBox="0 0 250 280" class="w-full h-full figure"><circle cx="125" cy="55" r="25" fill="white"/><path d="M125 82 L125 175" stroke="white" stroke-width="16" stroke-linecap="round"/><path d="${arm}" stroke="white" stroke-width="14" stroke-linecap="round" fill="none"/><path d="${leg}" stroke="white" stroke-width="16" stroke-linecap="round" fill="none"/><circle cx="45" cy="132" r="10" fill="#94a3b8"/><circle cx="200" cy="132" r="10" fill="#94a3b8"/><path d="M75 245 H175" stroke="#475569" stroke-width="5" stroke-linecap="round"/></svg>`}
function layout(content){return `<div class="min-h-screen bg-slate-950"><header class="h-16 border-b border-white/10 px-4 sm:px-6 flex items-center justify-between"><button onclick="go('home')" class="font-semibold flex items-center gap-3">${I('chevron-left')}<span>FitTrack <span class="text-slate-500">PRO</span></span></button><div class="text-xs text-slate-500">FULL BODY</div></header>${content}</div>`}
function home(){return `<div class="min-h-screen bg-slate-50 text-slate-950"><header class="h-16 px-5 sm:px-8 flex items-center justify-between border-b bg-white"><b class="text-lg">FitTrack <span class="text-slate-400">PRO</span></b><button onclick="go('history')" class="p-2 rounded-xl hover:bg-slate-100">${I('history')}</button></header><main class="max-w-6xl mx-auto p-5 sm:p-8 animate-in"><p class="text-xs tracking-[.2em] text-slate-400">TODAY · FULL BODY</p><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mt-2 mb-7"><div><h1 class="text-3xl sm:text-5xl font-semibold tracking-tight">พร้อมลุยหรือยัง?</h1><p class="text-slate-500 mt-2">6 ท่า · 18 เซ็ต · ฝึกแบบมีจังหวะและพักอย่างเป็นระบบ</p></div><button onclick="begin()" class="bg-slate-950 text-white px-6 py-4 rounded-2xl font-medium shadow-xl hover:scale-[1.02] transition">${I('play')} <span class="ml-2">เริ่ม Workout</span></button></div><div class="grid sm:grid-cols-3 gap-4 mb-7"><div class="sm:col-span-2 rounded-[2rem] bg-slate-950 text-white p-6 sm:p-8"><span class="text-xs text-slate-500">YOUR SESSION</span><div class="flex justify-between items-end"><div><h2 class="text-2xl font-semibold mt-2">Full Body Strength</h2><p class="text-slate-400 mt-1">ประมาณ 30–40 นาที</p></div><div class="text-4xl font-semibold">${S.sessions.length}<small class="text-sm text-slate-500"> workouts</small></div></div></div><div class="rounded-[2rem] bg-white border p-6"><p class="text-slate-400 text-sm">Weekly goal</p><b class="text-4xl block mt-4">${Math.min(4,S.sessions.length)}<span class="text-lg text-slate-400"> / 4</span></b><div class="h-2 bg-slate-100 rounded-full mt-5"><div class="h-full bg-slate-950 rounded-full" style="width:${Math.min(100,S.sessions.length/4*100)}%"></div></div></div></div><section class="bg-white border rounded-[2rem] p-5 sm:p-7"><div class="flex justify-between mb-5"><div><h3 class="text-xl font-semibold">Today's exercises</h3><p class="text-sm text-slate-400">น้ำหนักเริ่มต้นมาจาก Settings</p></div></div><div class="grid sm:grid-cols-2 gap-2">${EX.map((e,i)=>`<button onclick="S.ex=${i};begin()" class="flex items-center gap-4 p-4 rounded-2xl hover:bg-slate-50 text-left transition"><div class="w-14 h-14 rounded-2xl bg-slate-950 text-white grid place-items-center">${I('dumbbell')}</div><div class="flex-1"><b>${e.name}</b><p class="text-sm text-slate-400">${e.target} · ${S.weights[e.id]?S.weights[e.id]+' kg':'Bodyweight'}</p></div>${I('chevron-right')}</button>`).join('')}</div></section></main></div>`}
function workout(){const e=EX[S.ex],progress=Math.round(((S.ex*3+Math.min(S.set,3))/(EX.length*3))*100),rest=Math.max(0,S.rest);return `<div class="fixed inset-0 z-50 bg-slate-950 text-white overflow-y-auto"><div class="min-h-[100dvh] flex flex-col"><header class="h-16 shrink-0 px-4 sm:px-7 flex items-center justify-between border-b border-white/10"><button onclick="go('home')" class="flex items-center gap-2 text-slate-300 hover:text-white">${I('x')} <span class="hidden sm:inline">ออกจาก Workout</span></button><div class="text-center"><b class="text-sm">${e.name}</b><p class="text-[11px] text-slate-500">EXERCISE ${S.ex+1} / ${EX.length}</p></div><div class="text-sm text-slate-400">${S.set}/3</div></header><div class="h-1 bg-white/10"><div class="h-full bg-white transition-all duration-500" style="width:${progress}%"></div></div><main class="flex-1 w-full max-w-6xl mx-auto grid lg:grid-cols-[1.25fr_.75fr] gap-5 p-4 sm:p-7"><section class="rounded-[2rem] bg-gradient-to-b from-slate-800 to-slate-900 min-h-[390px] lg:min-h-0 flex items-center justify-center relative overflow-hidden"><div class="absolute inset-0 opacity-30 bg-[radial-gradient(circle_at_center,#64748b,transparent_45%)]"></div><div class="absolute top-5 left-5 right-5 flex justify-between text-xs text-slate-400"><span>${S.phase==='rest'?'REST':'ACTIVE'}</span><span>${e.target}</span></div><div class="w-[min(70vw,360px)] h-[min(70vw,400px)]">${figure(e.pose)}</div><div class="absolute bottom-5 left-5 right-5"><div class="flex gap-1">${EX.map((_,i)=>`<div class="h-1 flex-1 rounded-full ${i<S.ex?'bg-white':i===S.ex?'bg-slate-400':'bg-white/10'}"></div>`).join('')}</div></div></section><section class="flex flex-col justify-center py-2 lg:px-3"><span class="text-xs tracking-[.2em] text-slate-500">${S.phase==='rest'?'RECOVER':'NEXT SET'}</span><h1 class="text-3xl sm:text-4xl font-semibold mt-2">${e.name}</h1><p class="text-slate-400 mt-1">${e.tip}</p><div class="grid grid-cols-3 gap-2 mt-7"><div class="rounded-2xl bg-white/5 p-4"><small class="text-slate-500">SET</small><b class="block text-2xl mt-1">${Math.min(S.set+1,3)} / 3</b></div><div class="rounded-2xl bg-white/5 p-4"><small class="text-slate-500">TARGET</small><b class="block text-lg mt-2">${e.target}</b></div><div class="rounded-2xl bg-white/5 p-4"><small class="text-slate-500">WEIGHT</small><b class="block text-2xl mt-1">${S.weights[e.id]?S.weights[e.id]+' kg':'—'}</b></div></div>${S.phase==='rest'?`<div class="mt-6 rounded-[2rem] bg-white text-slate-950 p-6 text-center animate-pop"><p class="text-xs tracking-[.2em] text-slate-400">พักระหว่างเซ็ต</p><div class="text-7xl sm:text-8xl font-semibold tabular-nums tracking-tight my-2">${String(Math.floor(rest/60)).padStart(2,'0')}:${String(rest%60).padStart(2,'0')}</div><div class="flex gap-2 justify-center"><button onclick="S.rest=Math.min(180,S.rest+15);S.restStarted=Date.now()-(90-S.rest)*1000;render()" class="px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200">+15 วิ</button><button onclick="endRest()" class="px-5 py-3 rounded-xl bg-slate-950 text-white hover:scale-[1.02] transition">เลิกพัก →</button></div></div>`:S.phase==='complete'?`<div class="mt-6 rounded-[2rem] bg-white/10 p-6 text-center animate-pop"><div class="mx-auto w-14 h-14 rounded-full bg-white text-slate-950 grid place-items-center">${I('check')}</div><h2 class="text-xl font-semibold mt-4">ครบ 3 เซ็ตแล้ว</h2><p class="text-slate-400 mt-1">พร้อมไปท่าถัดไป</p><button onclick="nextExercise()" class="w-full mt-5 bg-white text-slate-950 py-4 rounded-2xl font-semibold">${S.ex===EX.length-1?'จบ Workout':'ท่าถัดไป'} →</button></div>`:`<div class="mt-6"><div class="flex justify-between text-sm mb-2"><span class="text-slate-400">สถานะ</span><b>${S.phase==='active'?'กำลังทำเซ็ต':'พร้อมเริ่ม'}</b></div><div class="h-2 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-white transition-all" style="width:${Math.min(100,((S.set)/3)*100)}%"></div></div><button onclick="${S.phase==='active'?'completeSet()':'startSet()'}" class="w-full mt-5 py-5 rounded-2xl bg-white text-slate-950 text-lg font-semibold hover:scale-[1.015] active:scale-[.98] transition shadow-2xl">${S.phase==='active'?'✓ จบเซ็ต':'▶ เริ่มจับเวลา'}</button><p class="text-center text-xs text-slate-500 mt-3">เมื่อกดจบเซ็ต ระบบจะบันทึกเวลาที่ใช้และเริ่มเวลาพักอัตโนมัติ</p></div>`}<div class="mt-5 flex items-center gap-3 text-xs text-slate-500">${I('info')} <span>เวลาการทำเซ็ตและเวลาพักจริงจะถูกบันทึกลง History</span></div></section></main></div></div>`}
function history(){return `<div class="min-h-screen bg-slate-50 text-slate-950"><header class="h-16 bg-white border-b px-5 flex items-center justify-between"><button onclick="go('home')">${I('chevron-left')}</button><b>History</b><span></span></header><main class="max-w-4xl mx-auto p-5 sm:p-8 animate-in"><p class="text-xs tracking-[.2em] text-slate-400">TRAINING LOG</p><h1 class="text-4xl font-semibold mt-2 mb-7">ประวัติการออกกำลังกาย</h1>${S.sessions.length?`<div class="space-y-3">${S.sessions.slice().reverse().map(x=>`<details class="bg-white border rounded-2xl p-5"><summary class="cursor-pointer list-none flex justify-between"><div><b>Full Body Workout</b><p class="text-sm text-slate-400 mt-1">${new Date(x.date).toLocaleString('th-TH')} · ${x.sets.length} sets · ${x.durationMinutes} min</p></div>${I('chevron-down')}</summary><div class="mt-5 pt-4 border-t space-y-2">${x.sets.map(s=>`<div class="grid grid-cols-4 text-sm py-2"><span>${s.exercise}</span><span>Set ${s.set}</span><span>${s.weightKg?s.weightKg+' kg':'Bodyweight'}</span><span class="text-right">${s.durationSeconds}s · พัก ${s.restSeconds}s</span></div>`).join('')}</div></details>`).join('')}</div>`:`<div class="bg-white border rounded-3xl p-12 text-center"><h2 class="text-xl font-semibold">ยังไม่มีประวัติ</h2><p class="text-slate-400 mt-1">เริ่ม Workout แรกของคุณได้เลย</p><button onclick="begin()" class="mt-5 bg-slate-950 text-white px-5 py-3 rounded-xl">เริ่ม Workout</button></div>`}</main></div>`}
function render(){document.body.className=S.screen==='workout'?'bg-slate-950':'bg-slate-50';document.getElementById('app').innerHTML=S.screen==='home'?home():S.screen==='workout'?workout():history();lucide.createIcons()}render();
</script></body></html>
