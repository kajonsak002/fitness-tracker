<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitTrack Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:Kanit,sans-serif}button,input{font:inherit}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes move{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.in{animation:in .4s ease-out both}.pop{animation:pop .25s ease-out both}.breathe{animation:breathe 2s ease-in-out infinite}.move{animation:move 1.5s ease-in-out infinite}
</style>
</head>
<body class="bg-slate-950 text-slate-900">
<div id="app"></div>
<script>
const PROGRAM=[
{id:'squat',name:'Goblet Squat',subtitle:'ขา · ก้น · แกนกลาง',reps:'10–12',defaultKg:8,tip:'อกเปิด หลังตรง ดันพื้นด้วยส้นเท้า',kind:'squat'},
{id:'rdl',name:'Dumbbell Romanian Deadlift',subtitle:'หลังขา · ก้น',reps:'10–12',defaultKg:8,tip:'ดันสะโพกไปด้านหลัง รักษาหลังให้เป็นกลาง',kind:'rdl'},
{id:'press',name:'Dumbbell Floor Press',subtitle:'อก · ไหล่ · หลังแขน',reps:'10–12',defaultKg:6,tip:'ข้อศอกทำมุมสบาย ควบคุมลงช้า ๆ',kind:'press'},
{id:'row',name:'One-arm Dumbbell Row',subtitle:'หลัง · ไบเซปส์',reps:'10 / ข้าง',defaultKg:8,tip:'ดึงศอกเข้าหาลำตัว อย่าบิดตัว',kind:'row'},
{id:'shoulder',name:'Dumbbell Shoulder Press',subtitle:'ไหล่ · หลังแขน',reps:'8–10',defaultKg:6,tip:'เกร็งแกนกลาง ดันดัมเบลขึ้นเหนือศีรษะ',kind:'shoulder'},
{id:'plank',name:'Plank',subtitle:'แกนกลางลำตัว',reps:'30–45 วินาที',defaultKg:0,tip:'ลำตัวเป็นเส้นตรง เกร็งหน้าท้องและก้น',kind:'plank'}];
const fresh={page:'dashboard',exercise:0,set:0,phase:'idle',startedAt:null,setStartedAt:null,restStartedAt:null,restDuration:90,weights:{},reps:{},currentSessionSets:[],sessions:[],lastSummary:null};
let state=Object.assign(fresh,load()); PROGRAM.forEach(e=>{if(state.weights[e.id]===undefined)state.weights[e.id]=e.defaultKg;if(state.reps[e.id]===undefined)state.reps[e.id]=parseInt(e.reps)||10});
function load(){try{return JSON.parse(localStorage.getItem('fittrack-pro-v3')||'{}')}catch{return {}}}function save(){localStorage.setItem('fittrack-pro-v3',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function fmtDate(d){return new Date(d).toLocaleString('th-TH',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function icon(n,c='w-5 h-5'){return `<span class="inline-flex ${c}">${({play:'▶',pause:'Ⅱ',check:'✓',chev:'›',back:'‹',timer:'◷',dumbbell:'▰',chart:'↗',history:'◴',settings:'⚙',home:'⌂',plus:'＋',minus:'−',fire:'◆',close:'×',skip:'»',spark:'✦',arrow:'→',trophy:'★'}[n]||'•')}</span>`}
function nav(page){if(state.phase!=='idle'&&page!=='workout'){toast('กำลังออกกำลังกายอยู่ — จบหรือออกจาก Workout ก่อน');return}state.page=page;render()}
function beginWorkout(){state.page='workout';state.exercise=0;state.set=0;state.phase='ready';state.startedAt=Date.now();state.currentSessionSets=[];save();render()}
function startSet(){if(state.phase==='ready'||state.phase==='rest'){state.phase='active';state.setStartedAt=Date.now();save();render()}}
function finishSet(){if(state.phase!=='active')return;const e=PROGRAM[state.exercise],duration=Math.max(1,Math.round((Date.now()-state.setStartedAt)/1000));const set={exerciseId:e.id,exercise:e.name,set:state.set+1,reps:Number(state.reps[e.id])||10,weightKg:Number(state.weights[e.id])||0,startedAt:new Date(state.setStartedAt).toISOString(),completedAt:new Date().toISOString(),durationSeconds:duration,restSeconds:0};state.currentSessionSets.push(set);state.set++;if(state.set<3){state.phase='rest';state.restStartedAt=Date.now();state.restDuration=90}else if(state.exercise<PROGRAM.length-1){state.exercise++;state.set=0;state.phase='ready'}else{finishWorkout();return}save();render()}
function finishRest(){if(state.phase!=='rest')return;const last=state.currentSessionSets.at(-1);if(last)last.restSeconds=Math.max(0,Math.round((Date.now()-state.restStartedAt)/1000));state.phase='ready';state.setStartedAt=null;save();render()}
function finishWorkout(){const now=Date.now();if(state.phase==='rest')finishRest();if(!state.currentSessionSets.length){cancelWorkout();return}const duration=Math.max(1,Math.round((now-(state.startedAt||now))/60000));state.sessions.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:new Date().toISOString(),durationMinutes:duration,sets:state.currentSessionSets});state.lastSummary={date:new Date().toISOString(),durationMinutes:duration,sets:state.currentSessionSets};state.phase='idle';state.page='history';state.startedAt=null;state.currentSessionSets=[];save();toast('บันทึก Workout สำเร็จ ✓');render()}
function cancelWorkout(){state.phase='idle';state.page='dashboard';state.startedAt=null;state.currentSessionSets=[];save();render()}
function adjustWeight(id,delta){state.weights[id]=Math.max(0,Math.round((Number(state.weights[id])+delta)*2)/2);save();render()}
function setReps(id,v){state.reps[id]=Math.max(1,Math.min(100,Number(v)||1));save()}
function toast(msg){const t=document.createElement('div');t.className='fixed top-5 left-1/2 -translate-x-1/2 z-[100] bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl pop';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function exerciseArt(kind){let pose={squat:['translate-y-3','M18 70 Q30 40 50 52 Q70 40 82 70'],rdl:['translate-y-2','M20 70 Q38 45 58 58 Q72 63 84 70'],press:['','M22 66 Q40 44 58 50 Q72 54 82 68'],row:['translate-x-1','M20 68 Q40 48 58 58 Q70 63 84 68'],shoulder:['-translate-y-1','M22 70 Q40 42 60 50 Q74 56 82 70'],plank:['translate-y-5','M15 67 Q35 55 55 60 Q70 63 87 67']}[kind];return `<div class="relative w-full h-full grid place-items-center overflow-hidden"><div class="absolute w-72 h-72 rounded-full bg-white/5 blur-2xl"></div><svg viewBox="0 0 100 100" class="w-64 sm:w-80 h-64 sm:h-80 ${pose[0]} move" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="25" r="8" fill="white" stroke="none"/><path d="${pose[1]}"/><path d="M50 33 L50 52 M50 39 L34 50 M50 39 L67 50 M50 52 L38 72 M50 52 L65 72"/><path d="M30 48 L25 42 M70 48 L76 42"/><circle cx="22" cy="40" r="3" fill="white"/><circle cx="79" cy="40" r="3" fill="white"/></svg><div class="absolute bottom-4 left-4 right-4 flex justify-between text-[11px] text-slate-400"><span>DEMO MOVEMENT</span><span>FOCUS: FORM</span></div></div>`}
function shell(content){return `<div class="min-h-screen bg-slate-50"><header class="fixed top-0 inset-x-0 z-40 h-16 bg-white/90 backdrop-blur-xl border-b border-slate-200"><div class="max-w-7xl mx-auto h-full px-4 lg:px-8 flex items-center justify-between"><button onclick="nav('dashboard')" class="flex items-center gap-3 font-semibold text-lg"><span class="w-9 h-9 rounded-xl bg-slate-950 text-white grid place-items-center">F</span>FitTrack <small class="text-slate-400 text-[10px] tracking-widest">PRO</small></button><div class="flex items-center gap-2 text-xs text-slate-400">${new Intl.DateTimeFormat('th-TH',{weekday:'long',day:'numeric',month:'short'}).format(new Date())}</div></div></header><div class="max-w-7xl mx-auto px-4 lg:px-8 pt-24 pb-24 lg:pb-10 lg:grid lg:grid-cols-[220px_1fr] lg:gap-8"><aside class="hidden lg:block sticky top-24 h-fit"><nav class="space-y-1">${[['dashboard','home','Dashboard'],['workout','dumbbell','Workout'],['history','history','History'],['progress','chart','Progress'],['settings','settings','Settings']].map(x=>`<button onclick="nav('${x[0]}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${state.page===x[0]?'bg-slate-950 text-white shadow-lg':'text-slate-500 hover:bg-white hover:text-slate-900'}">${icon(x[1])}${x[2]}</button>`).join('')}</nav></aside><main>${content}</main></div><nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-xl border-t border-slate-200"><div class="grid grid-cols-5 max-w-lg mx-auto">${[['dashboard','home'],['workout','dumbbell'],['history','history'],['progress','chart'],['settings','settings']].map(x=>`<button onclick="nav('${x[0]}')" class="py-3 flex justify-center ${state.page===x[0]?'text-slate-950':'text-slate-400'}">${icon(x[1])}</button>`).join('')}</div></nav></div>`}
function dashboard(){let total=state.sessions.reduce((a,s)=>a+s.sets.length,0),mins=state.sessions.reduce((a,s)=>a+s.durationMinutes,0);return shell(`<section class="in"><div class="flex items-end justify-between mb-7"><div><p class="text-xs tracking-[.25em] text-slate-400">FITNESS TRACKER</p><h1 class="text-3xl sm:text-4xl font-semibold mt-1">พร้อมลุย Workout วันนี้หรือยัง?</h1><p class="text-slate-400 mt-2">Full Body · 6 ท่า · 3 เซ็ตต่อท่า</p></div><button onclick="beginWorkout()" class="hidden sm:flex items-center gap-2 bg-slate-950 text-white px-5 py-3 rounded-2xl hover:-translate-y-0.5 transition shadow-xl">${icon('play')} เริ่ม Workout</button></div><div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 rounded-[2rem] bg-slate-950 text-white p-7 sm:p-9 relative overflow-hidden shadow-2xl"><div class="absolute -right-24 -top-24 w-80 h-80 rounded-full bg-white/5"></div><p class="text-xs tracking-widest text-slate-500">TODAY · FULL BODY</p><h2 class="text-3xl sm:text-4xl font-semibold mt-4 leading-tight">Build strength.<br>Move better.</h2><p class="text-slate-400 mt-3 max-w-md">ฝึกตามลำดับ พร้อมจับเวลาเซ็ตและเวลาพักอัตโนมัติ</p><button onclick="beginWorkout()" class="mt-7 bg-white text-slate-950 px-6 py-3 rounded-2xl font-medium hover:scale-[1.02] transition">เริ่มฝึกเลย ${icon('arrow','inline-flex ml-1')}</button></div><div class="bg-white rounded-[2rem] border border-slate-200 p-6 shadow-sm"><p class="text-sm text-slate-400">สถิติสะสม</p><div class="text-5xl font-semibold mt-5">${state.sessions.length}</div><p class="text-slate-400">Workouts</p><div class="grid grid-cols-2 gap-3 mt-7"><div class="p-3 bg-slate-50 rounded-2xl"><b>${total}</b><small class="block text-slate-400">sets</small></div><div class="p-3 bg-slate-50 rounded-2xl"><b>${mins}</b><small class="block text-slate-400">minutes</small></div></div></div></div><div class="mt-5 bg-white rounded-[2rem] border border-slate-200 p-5 sm:p-6"><div class="flex justify-between items-center mb-4"><div><h2 class="font-semibold text-xl">Today's exercises</h2><p class="text-sm text-slate-400">ค่าจาก Settings จะถูกใช้เป็นค่าเริ่มต้น</p></div></div><div class="grid sm:grid-cols-2 gap-2">${PROGRAM.map((e,i)=>`<button onclick="state.exercise=${i};state.page='workout';state.phase='ready';render()" class="p-4 rounded-2xl hover:bg-slate-50 transition text-left flex items-center gap-4 group"><div class="w-12 h-12 rounded-2xl bg-slate-100 grid place-items-center font-semibold">${String(i+1).padStart(2,'0')}</div><div class="flex-1"><b>${e.name}</b><p class="text-xs text-slate-400 mt-1">${e.reps} · ${e.defaultKg?state.weights[e.id]+' kg':'Bodyweight'}</p></div>${icon('chev')}</button>`).join('')}</div></div></section>`)}
function workout(){const e=PROGRAM[state.exercise], current=state.currentSessionSets.filter(s=>s.exerciseId===e.id).length;let phase=state.phase;return `<div class="fixed inset-0 z-50 bg-slate-950 text-white overflow-auto"><div class="min-h-full flex flex-col"><header class="h-16 shrink-0 border-b border-white/10 flex items-center justify-between px-4 sm:px-7"><button onclick="cancelWorkout()" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10">${icon('close')}</button><div class="text-center"><p class="text-[10px] tracking-[.25em] text-slate-500">FULL BODY</p><b>${state.exercise+1} / ${PROGRAM.length}</b></div><button onclick="finishWorkout()" class="text-sm text-slate-400 hover:text-white">จบ Workout</button></header><div class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-7 py-5 grid lg:grid-cols-[1.3fr_.7fr] gap-5"><div class="rounded-[2rem] bg-slate-900 border border-white/10 overflow-hidden min-h-[390px] lg:min-h-[650px] flex items-center justify-center">${exerciseArt(e.kind)}</div><div class="flex flex-col justify-center"><div class="mb-5"><p class="text-xs tracking-widest text-slate-500">${e.subtitle}</p><h1 class="text-3xl sm:text-4xl font-semibold mt-2">${e.name}</h1><div class="flex gap-2 mt-3"><span class="px-3 py-1.5 rounded-full bg-white/10 text-sm">${e.reps} reps</span><span class="px-3 py-1.5 rounded-full bg-white/10 text-sm">${state.weights[e.id]?state.weights[e.id]+' kg':'Bodyweight'}</span></div></div><div class="grid grid-cols-3 gap-2 mb-5">${[0,1,2].map(i=>`<div class="h-2 rounded-full ${i<current?'bg-white':'bg-white/10'}"></div>`).join('')}</div>${phase==='active'?activePanel():phase==='rest'?restPanel():readyPanel(e)}<div class="mt-4 p-4 rounded-2xl bg-white/5 border border-white/5 text-sm text-slate-400">${icon('spark')} <span><b class="text-white">Form tip</b> · ${e.tip}</span></div></div></div></div></div>`}
function readyPanel(e){return `<div class="rounded-3xl bg-white/5 border border-white/10 p-5"><div class="flex justify-between items-end"><div><p class="text-xs text-slate-500">SET</p><b class="text-5xl">${state.set+1}<span class="text-lg text-slate-500"> / 3</span></b></div><div class="text-right"><p class="text-xs text-slate-500">เป้าหมาย</p><b>${state.reps[e.id]} reps</b></div></div><div class="mt-5 flex items-center justify-between"><div><p class="text-xs text-slate-500">WEIGHT</p><b class="text-2xl">${state.weights[e.id]?state.weights[e.id].toFixed(1)+' kg':'Bodyweight'}</b></div>${e.defaultKg?`<div class="flex gap-2"><button onclick="adjustWeight('${e.id}',-.5)" class="w-11 h-11 rounded-xl bg-white/10 hover:bg-white/15">−</button><button onclick="adjustWeight('${e.id}',.5)" class="w-11 h-11 rounded-xl bg-white/10 hover:bg-white/15">+</button></div>`:''}</div><button onclick="startSet()" class="w-full mt-6 py-4 rounded-2xl bg-white text-slate-950 font-semibold text-lg hover:scale-[1.01] transition shadow-xl">${icon('play','inline-flex mr-2')} เริ่มจับเวลา</button></div>`}
function activePanel(){return `<div class="rounded-3xl bg-white/5 border border-white/10 p-5 pop"><div class="flex justify-between items-end"><div><p class="text-xs text-slate-500">กำลังเล่น · SET ${state.set+1}</p><div id="setClock" class="text-6xl font-semibold tabular-nums mt-1">00:00</div></div><div class="text-right"><p class="text-xs text-slate-500">REPS</p><input type="number" min="1" max="100" value="${state.reps[PROGRAM[state.exercise].id]}" onchange="setReps('${PROGRAM[state.exercise].id}',this.value)" class="w-20 bg-white/10 rounded-xl px-3 py-2 text-center text-xl outline-none"></div></div><button onclick="finishSet()" class="w-full mt-6 py-4 rounded-2xl bg-white text-slate-950 font-semibold text-lg hover:scale-[1.01] transition">✓ จบเซ็ต</button></div>`}
function restPanel(){return `<div class="rounded-3xl bg-white/5 border border-white/10 p-5 text-center pop"><p class="text-xs tracking-[.25em] text-slate-500">REST BETWEEN SETS</p><div id="restClock" class="text-7xl sm:text-8xl font-semibold tabular-nums my-3">${fmt(state.restDuration)}</div><div class="h-2 bg-white/10 rounded-full overflow-hidden"><div id="restBar" class="h-full bg-white rounded-full" style="width:100%"></div></div><div class="grid grid-cols-2 gap-2 mt-6"><button onclick="state.restDuration+=15;render()" class="py-3 rounded-xl bg-white/10 hover:bg-white/15">+15 วินาที</button><button onclick="finishRest()" class="py-3 rounded-xl bg-white text-slate-950 font-semibold">เลิกพัก →</button></div></div>`}
function history(){let all=state.sessions.slice().reverse();return shell(`<section class="in"><p class="text-xs tracking-widest text-slate-400">HISTORY</p><h1 class="text-3xl font-semibold mt-1 mb-6">Workout History</h1>${state.lastSummary?`<div class="mb-5 rounded-3xl bg-slate-950 text-white p-6"><p class="text-xs text-slate-500">JUST COMPLETED</p><div class="flex items-end justify-between mt-2"><div><h2 class="text-2xl font-semibold">Full Body Workout</h2><p class="text-slate-400">${state.lastSummary.sets.length} sets · ${state.lastSummary.durationMinutes} min</p></div><span class="w-12 h-12 rounded-full bg-white text-slate-950 grid place-items-center">✓</span></div></div>`:''}<div class="space-y-3">${all.length?all.map(s=>`<details class="group bg-white border border-slate-200 rounded-2xl overflow-hidden"><summary class="list-none cursor-pointer p-5 flex items-center gap-4"><div class="w-11 h-11 rounded-xl bg-slate-100 grid place-items-center">✓</div><div class="flex-1"><b>Full Body Workout</b><p class="text-sm text-slate-400 mt-1">${fmtDate(s.date)} · ${s.sets.length} sets · ${s.durationMinutes} min</p></div><span>›</span></summary><div class="px-5 pb-5 overflow-x-auto"><table class="w-full text-sm"><thead class="text-slate-400"><tr><th class="text-left py-2">ท่า</th><th>Set</th><th>Reps</th><th>KG</th><th>เวลา</th><th>พัก</th></tr></thead><tbody>${s.sets.map(x=>`<tr class="border-t border-slate-100"><td class="py-3">${x.exercise}</td><td class="text-center">${x.set}</td><td class="text-center">${x.reps}</td><td class="text-center">${x.weightKg||'—'}</td><td class="text-center">${fmt(x.durationSeconds)}</td><td class="text-center">${x.restSeconds?fmt(x.restSeconds):'—'}</td></tr>`).join('')}</tbody></table></div></details>`).join(''):`<div class="bg-white rounded-3xl border border-slate-200 p-12 text-center"><h2 class="text-xl font-semibold">ยังไม่มีประวัติ</h2><p class="text-slate-400 mt-1">เริ่ม Workout ครั้งแรกได้เลย</p><button onclick="beginWorkout()" class="mt-5 bg-slate-950 text-white px-5 py-3 rounded-xl">เริ่ม Workout</button></div>`}</div></section>`)}
function progress(){let sets=state.sessions.flatMap(s=>s.sets),volume=sets.reduce((a,x)=>a+(x.weightKg||0)*(Number(x.reps)||0),0),time=sets.reduce((a,x)=>a+x.durationSeconds,0);return shell(`<section class="in"><p class="text-xs tracking-widest text-slate-400">PROGRESS</p><h1 class="text-3xl font-semibold mt-1 mb-6">Training Progress</h1><div class="grid sm:grid-cols-3 gap-4 mb-5">${[['Sets',sets.length],['Volume',volume.toFixed(0)+' kg'],['Avg Set',sets.length?fmt(time/sets.length):'00:00']].map(x=>`<div class="bg-white rounded-2xl border border-slate-200 p-5"><p class="text-sm text-slate-400">${x[0]}</p><b class="text-2xl block mt-2">${x[1]}</b></div>`).join('')}</div><div class="bg-white rounded-3xl border border-slate-200 p-6"><h2 class="font-semibold text-lg">ความก้าวหน้ารายท่า</h2><div class="space-y-5 mt-5">${PROGRAM.map(e=>{let a=sets.filter(s=>s.exerciseId===e.id),last=a.at(-1);return `<div><div class="flex justify-between text-sm mb-2"><span>${e.name}</span><b>${last?(last.weightKg?last.weightKg+' kg':'Bodyweight'):'ยังไม่มีข้อมูล'}</b></div><div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-slate-950 rounded-full transition-all" style="width:${Math.min(100,a.length/3*100)}%"></div></div><p class="text-xs text-slate-400 mt-1">${a.length} sets completed</p></div>`}).join('')}</div></div></section>`)}
function settings(){return shell(`<section class="in max-w-3xl"><p class="text-xs tracking-widest text-slate-400">SETTINGS</p><h1 class="text-3xl font-semibold mt-1 mb-6">Workout Settings</h1><div class="bg-white rounded-3xl border border-slate-200 p-6"><h2 class="font-semibold text-lg">น้ำหนักเริ่มต้น</h2><p class="text-sm text-slate-400 mb-5">กำหนด KG สำหรับแต่ละท่า ค่าเหล่านี้จะถูกนำไปใช้เมื่อเริ่ม Workout</p><div class="divide-y divide-slate-100">${PROGRAM.map(e=>`<div class="py-4 flex items-center gap-4"><div class="w-11 h-11 rounded-xl bg-slate-100 grid place-items-center font-semibold">${e.name.slice(0,1)}</div><div class="flex-1"><b>${e.name}</b><p class="text-xs text-slate-400">${e.reps}</p></div>${e.defaultKg?`<div class="flex items-center gap-2"><button onclick="adjustWeight('${e.id}',-.5)" class="w-9 h-9 rounded-xl bg-slate-100">−</button><b class="w-16 text-center">${state.weights[e.id].toFixed(1)} kg</b><button onclick="adjustWeight('${e.id}',.5)" class="w-9 h-9 rounded-xl bg-slate-950 text-white">+</button></div>`:`<span class="text-sm text-slate-400">Bodyweight</span>`}</div>`).join('')}</div></div><div class="bg-white rounded-3xl border border-slate-200 p-6 mt-4"><h2 class="font-semibold text-lg">Rest Timer</h2><p class="text-sm text-slate-400">เวลาพักมาตรฐานหลังจบเซ็ต</p><div class="mt-4 flex items-center gap-3"><b class="text-3xl">90</b><span class="text-slate-400">วินาที</span></div></div><button onclick="if(confirm('ล้างประวัติและค่าตั้งค่าทั้งหมด?')){localStorage.removeItem('fittrack-pro-v3');location.reload()}" class="mt-4 text-sm text-red-500 hover:text-red-700">ล้างข้อมูลทั้งหมด</button></section>`)}
function render(){if(state.page==='workout'){document.getElementById('app').innerHTML=workout();startTicker();return}document.getElementById('app').innerHTML={dashboard,history,progress,settings}[state.page]();}
let ticker=null;function startTicker(){clearInterval(ticker);ticker=setInterval(()=>{if(state.phase==='active'){const el=document.getElementById('setClock');if(el)el.textContent=fmt((Date.now()-state.setStartedAt)/1000)}if(state.phase==='rest'){const elapsed=(Date.now()-state.restStartedAt)/1000,left=Math.max(0,state.restDuration-elapsed),el=document.getElementById('restClock'),bar=document.getElementById('restBar');if(el)el.textContent=fmt(left);if(bar)bar.style.width=Math.max(0,left/state.restDuration*100)+'%';if(left<=0){finishRest()}}},250)}
render();
</script>
</body></html>
