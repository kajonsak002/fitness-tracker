<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack Pro · Workout</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Kanit,sans-serif}button{transition:.2s}button:active{transform:scale(.97)}</style></head><body class="bg-slate-950 text-white"><div id="app"></div><script>
let plan,exs;let q=new URLSearchParams(location.search);let selected=q.get('exercise');let state={i:0,set:0,status:'ready',startedAt:null,restStarted:null,rest:90,setRecords:[]};const key=selected;fetch('../assets/exercises.json').then(r=>r.json()).then(d=>{plan=d.plan;exs=d.exercises;if(key){let today=plan.days[['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date().getDay()]];let idx=today.exercises.indexOf(key);if(idx>=0)state.i=idx}render()});
function today(){return plan.days[['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date().getDay()]]}function e(){return exs[today().exercises[state.i]]}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function elapsed(){return state.startedAt?Math.floor((Date.now()-state.startedAt)/1000):0}function start(){state.status='active';state.startedAt=Date.now();render();tick()}function complete(){let seconds=elapsed();state.setRecords.push({exerciseId:today().exercises[state.i],set:state.set+1,weightKg:e().defaultKg,reps:e().reps,durationSeconds:seconds,restSeconds:state.set<e().sets-1?state.rest:0,startedAt:new Date(state.startedAt).toISOString(),completedAt:new Date().toISOString()});state.set++;state.startedAt=null;if(state.set<e().sets){state.status='rest';state.rest=90;render();restTick()}else{if(state.i<today().exercises.length-1){state.i++;state.set=0;state.status='ready';render()}else finish()}}function restTick(){if(state.status!=='rest')return;if(state.rest>0){state.rest--;render();setTimeout(restTick,1000)}else{state.status='ready';render()}}function skipRest(){state.status='ready';render()}function finish(){let old=JSON.parse(localStorage.getItem('fittrack-pro')||'{"sessions":[]}');old.sessions=old.sessions||[];old.sessions.push({date:new Date().toISOString(),durationMinutes:Math.max(1,Math.round(state.setRecords.reduce((a,x)=>a+x.durationSeconds+x.restSeconds,0)/60)),sets:state.setRecords});localStorage.setItem('fittrack-pro',JSON.stringify(old));location.href='../src/dashboard-v3.html'}function render(){if(!plan)return;let x=e();let total=today().exercises.length;document.getElementById('app').innerHTML=`<main class="min-h-screen flex flex-col"><header class="h-16 px-4 sm:px-8 flex items-center justify-between border-b border-white/10"><a href="./dashboard-v3.html" class="text-slate-400 hover:text-white">← ออก</a><div class="text-center"><b>FULL BODY</b><p class="text-xs text-slate-500">${state.i+1} / ${total}</p></div><span class="text-sm text-slate-400">SET ${Math.min(state.set+1,x.sets)} / ${x.sets}</span></header><section class="flex-1 grid lg:grid-cols-[1.15fr_.85fr] max-w-7xl w-full mx-auto"><div class="min-h-[48vh] lg:min-h-0 bg-slate-900 flex items-center justify-center p-4 sm:p-8"><div class="w-full max-w-2xl"><div class="aspect-[4/3] rounded-[2rem] overflow-hidden bg-slate-800"><img src="${x.image}" alt="${x.name}" class="w-full h-full object-cover"></div><p class="text-xs text-slate-500 mt-3">ภาพอ้างอิงท่าฝึก · ${x.source}</p></div></div><div class="p-5 sm:p-8 lg:p-12 flex flex-col justify-center"><span class="text-xs tracking-widest text-slate-500">${x.category}</span><h1 class="text-3xl sm:text-5xl font-semibold mt-2">${x.name}</h1><div class="grid grid-cols-3 gap-3 mt-7"><div class="rounded-2xl bg-white/5 p-4"><small class="text-slate-500">TARGET</small><b class="block mt-1">${x.reps}</b></div><div class="rounded-2xl bg-white/5 p-4"><small class="text-slate-500">WEIGHT</small><b class="block mt-1">${x.defaultKg?x.defaultKg+' kg':'Bodyweight'}</b></div><div class="rounded-2xl bg-white/5 p-4"><small class="text-slate-500">SET</small><b class="block mt-1">${state.set+1}/${x.sets}</b></div></div>${state.status==='ready'?`<div class="mt-8"><button onclick="start()" class="w-full py-5 rounded-2xl bg-white text-slate-950 text-xl font-semibold hover:scale-[1.01]">▶ เริ่มจับเวลา</button><p class="text-center text-sm text-slate-500 mt-3">เตรียมท่าให้พร้อม แล้วเริ่มเมื่อพร้อม</p></div>`:''}${state.status==='active'?`<div class="mt-8"><div class="text-center mb-5"><p class="text-xs tracking-widest text-slate-500">SET TIMER</p><div class="text-6xl font-semibold tabular-nums mt-1">${fmt(elapsed())}</div></div><button onclick="complete()" class="w-full py-5 rounded-2xl bg-white text-slate-950 text-xl font-semibold">✓ จบเซ็ต</button></div>`:''}${state.status==='rest'?`<div class="mt-8 rounded-3xl bg-white/5 p-6 text-center"><p class="text-xs tracking-widest text-slate-500">REST BETWEEN SETS</p><div class="text-6xl font-semibold tabular-nums mt-2">${fmt(state.rest)}</div><div class="flex gap-3 mt-5"><button onclick="state.rest+=15;render()" class="flex-1 py-4 rounded-xl bg-white/10">+15 วิ</button><button onclick="skipRest()" class="flex-1 py-4 rounded-xl bg-white text-slate-950 font-semibold">เลิกพัก →</button></div><p class="text-sm text-slate-500 mt-4">พักให้ครบก่อนเริ่มเซ็ตถัดไป หรือเลิกพักเมื่อพร้อม</p></div>`:''}<div class="mt-8"><div class="flex gap-2">${Array.from({length:x.sets},(_,i)=>`<span class="h-2 flex-1 rounded-full ${i<state.set?'bg-white':'bg-white/10'}"></span>`).join('')}</div><p class="text-sm text-slate-500 mt-3">${state.setRecords.filter(r=>r.exerciseId===today().exercises[state.i]).length} sets recorded</p></div></div></section></main>`}function tick(){if(state.status==='active'){render();setTimeout(tick,1000)}}
</script></body></html>
