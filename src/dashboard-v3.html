<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack Pro · Dashboard</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Kanit,sans-serif}.glass{backdrop-filter:blur(18px);background:#ffffffcc}.hide-scroll::-webkit-scrollbar{display:none}</style></head><body class="bg-slate-50 text-slate-900"><div id="app"></div><script>
const days=[['monday','จันทร์'],['tuesday','อังคาร'],['wednesday','พุธ'],['thursday','พฤหัส'],['friday','ศุกร์'],['saturday','เสาร์'],['sunday','อาทิตย์']];let data={plan:null,exercises:null};fetch('./assets/exercises.json').then(r=>r.json()).then(x=>{data=x;render()});
const dayKey=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date().getDay()];const storage=()=>JSON.parse(localStorage.getItem('fittrack-pro')||'{"sessions":[]}');
function render(){if(!data.plan)return document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center">กำลังโหลดแผน...</div>';const s=storage(),sessions=s.sessions||[],today=data.plan.days[dayKey],doneToday=sessions.filter(x=>new Date(x.date).toDateString()===new Date().toDateString()).length,sets=sessions.reduce((a,x)=>a+(x.sets?.length||0),0),mins=sessions.reduce((a,x)=>a+(x.durationMinutes||0),0);document.getElementById('app').innerHTML=`<div class="min-h-screen"><header class="sticky top-0 z-20 border-b border-slate-200/70 glass"><div class="max-w-7xl mx-auto px-4 lg:px-8 h-16 flex items-center justify-between"><div class="flex items-center gap-3"><span class="w-9 h-9 rounded-xl bg-slate-950 text-white grid place-items-center font-bold">F</span><b>FitTrack <span class="text-xs text-slate-400">PRO</span></b></div><a href="./pro-workout.html" class="px-4 py-2 rounded-xl bg-slate-950 text-white text-sm">เข้า Workout →</a></div></header><main class="max-w-7xl mx-auto px-4 lg:px-8 py-8"><div class="mb-7"><p class="text-sm text-slate-400">${new Intl.DateTimeFormat('th-TH',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</p><h1 class="text-3xl sm:text-4xl font-semibold">แผนของคุณวันนี้</h1><p class="text-slate-500 mt-1">${data.plan.plan.goal} · เป้าหมาย ${data.plan.plan.weeklyGoal} วัน/สัปดาห์</p></div><div class="grid lg:grid-cols-[1.5fr_1fr] gap-5 mb-6"><section class="rounded-3xl bg-slate-950 text-white p-6 sm:p-8"><div class="flex justify-between"><div><span class="text-xs tracking-widest text-slate-400">TODAY'S PLAN</span><h2 class="text-3xl font-semibold mt-2">${today.title}</h2><p class="text-slate-400 mt-2">${today.type==='rest'?'วันนี้เป็นวันพัก ให้ร่างกายฟื้นตัว':today.exercises.length+' ท่า · '+today.exercises.reduce((a,id)=>a+data.exercises[id].sets,0)+' sets'}</p></div><div class="text-right"><b class="text-4xl">${doneToday}</b><p class="text-xs text-slate-500">completed</p></div></div>${today.exercises.length?`<a href="./pro-workout.html" class="inline-block mt-6 bg-white text-slate-950 px-5 py-3 rounded-xl font-medium">เริ่มแผนวันนี้ →</a>`:''}</section><section class="bg-white rounded-3xl border border-slate-100 p-6"><p class="text-sm text-slate-400">ภาพรวม</p><div class="grid grid-cols-3 gap-3 mt-5">${[['Workout',sessions.length],['Sets',sets],['Minutes',mins]].map(x=>`<div><b class="text-2xl">${x[1]}</b><p class="text-xs text-slate-400">${x[0]}</p></div>`).join('')}</div></section></div><section class="mb-6"><div class="flex justify-between items-end mb-3"><div><h2 class="text-xl font-semibold">ตารางประจำสัปดาห์</h2><p class="text-sm text-slate-400">4 วันฝึก · 2 วันพัก · 1 วัน Active Recovery</p></div></div><div class="flex gap-3 overflow-x-auto hide-scroll pb-2">${days.map(([key,label])=>{let d=data.plan.days[key],active=key===dayKey,done=sessions.some(x=>new Date(x.date).toDateString()===new Date().toDateString()&&key===dayKey);return `<div class="min-w-[150px] sm:min-w-0 sm:flex-1 rounded-2xl border p-4 ${active?'bg-slate-950 text-white border-slate-950':'bg-white border-slate-100'}"><div class="flex justify-between"><b>${label}</b>${done?'✓':''}</div><p class="text-sm mt-3 ${active?'text-slate-400':'text-slate-500'}">${d.title}</p><p class="text-xs mt-1 ${active?'text-slate-500':'text-slate-400'}">${d.exercises.length?d.exercises.length+' ท่า':'พัก'}</p></div>`}).join('')}</div></section><section class="bg-white rounded-3xl border border-slate-100 p-5 sm:p-6"><div class="flex justify-between items-center mb-5"><div><h2 class="text-xl font-semibold">ท่าของวันนี้</h2><p class="text-sm text-slate-400">ภาพจริง + น้ำหนักตั้งต้นจาก Settings</p></div></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${today.exercises.map((id,i)=>{let e=data.exercises[id];return `<a href="./pro-workout.html?exercise=${id}" class="group overflow-hidden rounded-2xl border border-slate-100 hover:shadow-lg hover:-translate-y-0.5 transition"><div class="h-44 bg-slate-100 overflow-hidden"><img src="${e.image}" alt="${e.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy"></div><div class="p-4"><div class="flex justify-between gap-3"><div><b>${i+1}. ${e.name}</b><p class="text-xs text-slate-400 mt-1">${e.category}</p></div><span class="text-xs bg-slate-100 px-2 py-1 rounded-lg">${e.defaultKg?e.defaultKg+' kg':'Bodyweight'}</span></div><p class="text-sm text-slate-500 mt-3">${e.sets} sets · ${e.reps}</p></div></a>`}).join('')}</div></section></main></div>`} </script></body></html>
